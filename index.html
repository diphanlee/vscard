<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>웹 명함</title>

  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="business-card">
    <section class="profile">

      <img
        class="profile-image"
        src="./cat1.jpg"
        alt="프로필 이미지"
        onerror="this.style.display='none';"
      />

      <h1 class="name placeholder">
        이름을 입력하세요
      </h1>

      <p class="job placeholder">
        직군을 입력하세요
      </p>

    </section>

    <div class="divider"></div>

    <section class="experience-section" aria-labelledby="tools-heading">
      <h2 class="section-heading" id="tools-heading">TOOL</h2>
      <p class="section-content">Exel, PowerPoint, Adobe Illustrator</p>
    </section>

    <section class="experience-section" aria-labelledby="games-heading">
      <h2 class="section-heading" id="games-heading">Game play Experience</h2>
      <ul class="experience-list">
        <li>리그 오브 레전드</li>
        <li>데이브 더 다이버</li>
        <li>와일드 리프트</li>
        <li>젤다의 전설: 왕국의 눈물</li>
        <li>젤다의 전설: 브레스 오브 더 와일드</li>
        <li>모여봐요 동물의 숲</li>
        <li>메이플 스토리</li>
        <li>테일즈 런너</li>
      </ul>
    </section>

    <section class="contact-list">

      <div class="contact-item">
        <span class="contact-label">
          Email
        </span>

        <a
          class="contact-value placeholder"
          href="#"
          id="email"
          aria-disabled="true"
        >
          이메일을 입력하세요
        </a>
      </div>

      <div class="contact-item">
        <span class="contact-label">
          Phone
        </span>

        <a
          class="contact-value placeholder"
          href="#"
          id="phone"
          aria-disabled="true"
        >
          전화번호를 입력하세요
        </a>
      </div>

    </section>

    <section class="actions">

      <button
        class="button button-primary"
        id="emailButton"
        type="button"
        disabled
      >
        이메일 보내기
      </button>

      <button
        class="button button-secondary"
        id="copyButton"
        type="button"
        disabled
      >
        연락처 복사
      </button>

      <a
        class="button button-github"
        href="https://github.com/diphanlee"
        target="_blank"
        rel="noopener noreferrer"
      >😺Github 보기</a>

    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
